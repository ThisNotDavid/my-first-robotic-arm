<svg xmlns="http://www.w3.org/2000/svg" width="520" height="320" viewBox="0 0 520 320" font-family="Arial, sans-serif" font-size="14">
  <rect width="520" height="320" fill="#ffffff"/>
  <!-- ground -->
  <line x1="40" y1="270" x2="480" y2="270" stroke="#999" stroke-width="1.5"/>
  <text x="440" y="290" fill="#666">h (reach)</text>
  <text x="58" y="40" fill="#666">z</text>
  <line x1="70" y1="270" x2="70" y2="50" stroke="#999" stroke-width="1" stroke-dasharray="4 4"/>
  <!-- target line l -->
  <line x1="70" y1="270" x2="390" y2="150" stroke="#2b7bb9" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="250" y="232" fill="#2b7bb9">l = √(h² + z²)</text>
  <!-- links -->
  <line x1="70" y1="270" x2="170" y2="90" stroke="#222" stroke-width="6" stroke-linecap="round"/>
  <line x1="170" y1="90" x2="390" y2="150" stroke="#222" stroke-width="6" stroke-linecap="round"/>
  <circle cx="70" cy="270" r="8" fill="#e07a1f"/>
  <circle cx="170" cy="90" r="8" fill="#e07a1f"/>
  <circle cx="390" cy="150" r="8" fill="#2b7bb9"/>
  <text x="22" y="165">L₁ = 12 cm</text>
  <text x="270" y="105">L₂ = 12 cm</text>
  <text x="372" y="180" fill="#2b7bb9">gripper (h, z)</text>
  <!-- angles -->
  <path d="M 120 270 A 50 50 0 0 0 117 252" fill="none" stroke="#2b7bb9" stroke-width="1.5"/>
  <text x="125" y="262" fill="#2b7bb9">φ</text>
  <path d="M 112 251 A 46 46 0 0 0 92 229" fill="none" stroke="#e07a1f" stroke-width="1.5"/>
  <text x="104" y="236" fill="#e07a1f">θ₁</text>
  <path d="M 196 97 A 28 28 0 0 1 150 126" fill="none" stroke="#e07a1f" stroke-width="1.5"/>
  <text x="182" y="128" fill="#e07a1f">θ₂</text>
  <text x="40" y="310" fill="#444">shoulder = θ₁ + φ   ·   elbow from θ₂   ·   wrist = 180° − θ₁ − θ₂ − φ</text>
</svg>
